<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priorix - Task Management</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">Priorix</h1>
            <div class="auth-buttons">
                <button onclick="logout()">Logout</button>
            </div>
        </header>

        <!-- Notification for upcoming tasks -->
        <div id="notification-area" class="notification">
            <strong>Upcoming Task:</strong> <span id="notification-text"></span>
        </div>

        <!-- High Priority Warning -->
        <div id="high-priority-warning" class="warning-banner" style="display: none;">
            <span class="warning-icon">⚠️</span>
            <strong>Warning:</strong> You have uncompleted HIGH priority tasks! Action required.
        </div>

        <div class="dashboard-controls">
            <div class="progress-container">
                <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-muted);">
                    <span>Task Progress</span>
                    <span id="progress-text">0/0 Completed</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
            <button class="primary" onclick="toggleTaskForm()" style="width: auto;">+ New Task</button>
        </div>

        <!-- Task Form Modal/Area -->
        <div id="task-form-container" class="task-form-container">
            <h2 id="form-title" style="margin-bottom: 1rem;">Add New Task</h2>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="form-group">
                    <label for="task-title">Title</label>
                    <input type="text" id="task-title" required>
                </div>
                <div class="form-group">
                    <label for="task-desc">Description</label>
                    <input type="text" id="task-desc">
                </div>
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 150px;">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label for="task-due">Due Date</label>
                        <input type="datetime-local" id="task-due">
                    </div>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="primary">Save Task</button>
                    <button type="button" class="primary" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-color);" onclick="toggleTaskForm()">Cancel</button>
                </div>
            </form>
        </div>

        <!-- Dashboard Main Layout -->
        <div class="dashboard-main">
            <!-- Sidebar for Widgets -->
            <div class="dashboard-sidebar">
                <!-- Task Suggestion Widget -->
                <div id="suggestion-widget" class="widget">
                    <h3>Suggested Task</h3>
                    <div id="suggested-task-content">
                        <p class="text-muted">No pending tasks to suggest.</p>
                    </div>
                </div>

                <!-- Calendar Widget -->
                <div id="calendar-widget" class="widget">
                    <div class="calendar-header">
                        <button id="prev-month">&lt;</button>
                        <h3 id="calendar-month-year">Month Year</h3>
                        <button id="next-month">&gt;</button>
                    </div>
                    <div class="calendar-days-header">
                        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                    </div>
                    <div id="calendar-grid" class="calendar-grid">
                        <!-- Days generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Task List -->
            <div id="task-list" class="task-list">
                <!-- Tasks will be injected here via JavaScript -->
                <p style="text-align: center; color: var(--text-muted); margin-top: 2rem;">Loading tasks...</p>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
