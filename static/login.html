<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Priorix</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="split-layout">
        <div class="split-left">
            <div class="left-content">
                <img src="/static/hero.png" alt="Priorix Illustration">
                <h2>Prioritize and conquer your tasks.</h2>
                <p>Welcome to Priorix, the ultimate productivity tool designed to help you organize your daily tasks efficiently.</p>
            </div>
        </div>
        
        <div class="split-right">
            <div class="login-form-wrapper">
                <h1 class="logo" style="text-align: center; margin-bottom: 2rem; font-size: 3rem;">Priorix</h1>
                
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('login')">Login</div>
                    <div class="tab" onclick="switchTab('register')">Sign Up</div>
                </div>

                <div id="error-message" class="error-message"></div>

                <div id="login-tab" class="tab-content active">
                    <form id="login-form">
                        <div class="form-group">
                            <label for="login-username">Username</label>
                            <input type="text" id="login-username" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" required>
                        </div>
                        <button type="submit" class="primary">Login</button>
                    </form>
                </div>

                <div id="register-tab" class="tab-content">
                    <form id="register-form">
                        <div class="form-group">
                            <label for="reg-username">Username</label>
                            <input type="text" id="reg-username" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-password">Password</label>
                            <input type="password" id="reg-password" required>
                        </div>
                        <button type="submit" class="primary">Sign Up</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('error-message').style.display = 'none';

            if (tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('login-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('register-tab').classList.add('active');
            }
        }

        async function handleAuth(e, endpoint, usernameId, passwordId) {
            e.preventDefault();
            const username = document.getElementById(usernameId).value;
            const password = document.getElementById(passwordId).value;
            const errorDiv = document.getElementById('error-message');
            
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                if (res.ok) {
                    window.location.href = '/'; // Redirect to dashboard
                } else {
                    errorDiv.textContent = data.error || 'Authentication failed';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Server error. Please try again.';
                errorDiv.style.display = 'block';
            }
        }

        document.getElementById('login-form').addEventListener('submit', (e) => handleAuth(e, '/api/login', 'login-username', 'login-password'));
        document.getElementById('register-form').addEventListener('submit', (e) => handleAuth(e, '/api/register', 'reg-username', 'reg-password'));
    </script>
</body>
</html>
